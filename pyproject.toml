[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mcprack-client"
version = "1.0.0"
description = "Shared library for mcprack MCP client config sync utilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vítězslav Dvořák", email = "info@vitexsoftware.cz"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/VitexSoftware/mcprack-client"
Repository = "https://github.com/VitexSoftware/mcprack-client"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcprack_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
